  .card:hover { box-shadow: 0 4px 14px rgba(0,0,0,.18); }
  .card h2 { margin: 0 0 6px; font-size: 1.1rem; color: #3b1931; }
  .card p { margin: 0; color: #9e8496; font-size: .95rem; }
</style>
